<style>
/* Layout: Apple-clean single column of statements on a white→grey gradient; one red light behind the strategist, red used only for action */
:root{
  --white:#FFFFFF; --grey1:#F5F5F7; --grey2:#ECECF0; --ink:#1D1D1F; --sub:#6E6E73; --line:#D2D2D7;
  --red:#C92720; --red-dk:#A91F19; --dark:#1D1D1F;
  --sans:"DM Sans",-apple-system,system-ui,sans-serif; --ar:"Cairo","DM Sans",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:linear-gradient(180deg,#FFFFFF 0%,#ECECF0 100%);background-color:var(--grey2);color:var(--ink);font:18px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body[dir="rtl"]{font-family:var(--ar)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:rgba(255,255,255,.85)}
.band{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:110px}
.w{max-width:1080px;margin:0 auto}
.c{max-width:780px;margin:0 auto;text-align:center}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.035em;text-wrap:balance;line-height:1.05}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3{letter-spacing:0;line-height:1.3}
h2{font-size:clamp(36px,5.6vw,68px)}
h3{font-size:26px;letter-spacing:-.02em;line-height:1.2}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:6px}
.eb{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--red);margin-bottom:16px}
[dir="rtl"] .eb{letter-spacing:0;font-size:15px}
.lead{font-size:clamp(19px,2.2vw,23px);line-height:1.45;color:var(--sub);margin-top:20px;letter-spacing:-.01em}
.close{font-size:clamp(22px,2.6vw,30px);font-weight:700;letter-spacing:-.025em;line-height:1.25;text-align:center;max-width:760px;margin:56px auto 0;text-wrap:balance}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:15px 28px;border-radius:999px;font:500 17px inherit;font-family:inherit;text-decoration:none;border:0;cursor:pointer;background:var(--red);color:#fff;transition:background .2s}
.btn:hover{background:var(--red-dk)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.lnk{color:var(--red);font-weight:500;text-decoration:none}
.lnk:hover{text-decoration:underline}
.ctas{display:flex;gap:14px 26px;align-items:center;flex-wrap:wrap;margin-top:32px}
.ctas.mid{justify-content:center}
.card{background:var(--white);border-radius:24px;min-width:0}

/* nav */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(255,255,255,.78);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.06);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav .w{display:flex;justify-content:space-between;align-items:center;gap:16px;height:52px;font-size:14px}
nav .nm{font-weight:700;letter-spacing:.06em;font-size:13px}
[dir="rtl"] nav .nm{letter-spacing:0;font-size:15px}
nav .links{display:flex;gap:24px;align-items:center}
nav .links a{text-decoration:none;color:#424245}
nav .links a:hover{color:var(--ink)}
nav .go{color:var(--red)!important;font-weight:600}
.lang{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:5px 12px;font:600 13px var(--sans);cursor:pointer;color:var(--ink)}
.lang:hover{border-color:var(--ink)}
@media(max-width:760px){nav .links a:not(.go){display:none}}

/* hero */
.hero{padding-block:56px 0;border-bottom:1px solid var(--line)}
/* black + red glow sections */
.night{background:radial-gradient(ellipse 60% 55% at 85% 100%,rgba(201,39,32,.2),transparent 70%),radial-gradient(ellipse 45% 40% at 10% 0%,rgba(201,39,32,.07),transparent 70%),#000;color:#F5F5F7}
.night .lead,.night .note{color:#A1A1A6}
.night .card{background:#161617;color:#F5F5F7;box-shadow:0 0 0 1px #2a2a2c}
.night .lbl,.night .case .meta{color:#86868B}
.night .prob .why{background:#0d0d0e;color:#D2D2D7}
.night .prob .q{color:#fff}
.night .prob .q .lbl,.night .eb,.night .prob .num,.night .case .ind{color:#FF6B62}
.night .status{background:#2a2a2c}
.night .case .focus{border-color:#2a2a2c}
.hero .w{display:grid;grid-template-columns:.95fr 1.05fr;gap:56px;align-items:end}
.hero .w>*{min-width:0}
.ph{position:relative}
.ph img{display:block;width:100%;max-width:470px;aspect-ratio:341/420;object-fit:cover;object-position:top;border-radius:28px 28px 0 0;margin-inline:auto}
.htxt{padding-bottom:72px}
.hname{font-size:17px;font-weight:600;color:var(--sub);margin-bottom:10px}
.hero h1{font-size:clamp(44px,6.4vw,82px);letter-spacing:-.045em;line-height:1}
[dir="rtl"] .hero h1{letter-spacing:0;line-height:1.25;font-size:clamp(38px,5.4vw,66px)}
.hero .lead{max-width:30em}
.sig{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);display:grid;gap:4px}
.sig .en{font-weight:600;font-size:17px}
.sig .ar{font-family:var(--ar);font-size:17px;color:var(--sub);direction:rtl;text-align:start}
[dir="ltr"] .sig .ar{text-align:left}
.micro{font-size:14px;color:var(--sub);margin-top:14px}
@media(max-width:860px){.hero .w{grid-template-columns:1fr;gap:28px}.htxt{padding-bottom:20px}.ph img{max-width:360px}}

/* proof */
.proof{padding-block:0 0}
.proof .w{display:grid;grid-template-columns:1fr 1fr;gap:14px;transform:translateY(-1px)}
.stat{padding:30px 32px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.stat b{font-size:clamp(44px,5.5vw,64px);font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--ink)}
.stat span{font-size:17px;color:var(--sub)}
@media(max-width:600px){.proof .w{grid-template-columns:1fr}}

/* problems */
.probs{display:grid;gap:14px;margin-top:56px}
.prob{display:grid;grid-template-columns:auto 1fr 1fr;gap:0;overflow:hidden}
.prob>*{padding:30px 28px;min-width:0}
.prob .num{font-size:15px;font-weight:700;color:var(--red);padding-inline-end:0}
.prob .say{font-size:clamp(21px,2.3vw,27px);font-weight:700;letter-spacing:-.025em;line-height:1.25}
[dir="rtl"] .prob .say{letter-spacing:0;line-height:1.5}
.lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin-bottom:8px}
[dir="rtl"] .lbl{letter-spacing:0;font-size:13px}
.prob .why{background:var(--grey1);font-size:16.5px;display:grid;gap:18px;align-content:start}
.prob .q{font-weight:700;font-size:17.5px;color:var(--ink)}
.prob .q .lbl{color:var(--red)}
@media(max-width:820px){.prob{grid-template-columns:1fr}.prob .num{padding-bottom:0}}

/* board */
.toggle{display:inline-flex;background:var(--white);border-radius:999px;padding:4px;margin-top:32px;box-shadow:0 0 0 1px var(--line)}
.toggle button{font:600 14px inherit;font-family:inherit;border:0;background:transparent;padding:10px 20px;border-radius:999px;cursor:pointer;color:var(--sub);letter-spacing:.04em}
.toggle button[aria-pressed="true"]{background:var(--ink);color:#fff}
.board{position:relative;margin-top:40px;height:500px;border-radius:28px;background:var(--white);overflow:hidden}
.chip{position:absolute;left:0;top:0;padding:10px 16px;border-radius:999px;background:var(--grey1);font-size:15px;font-weight:500;white-space:nowrap;transition:transform .9s cubic-bezier(.2,.8,.2,1),background .5s,color .5s}
.board.sys .chip{background:var(--ink);color:#fff}
.colh{position:absolute;opacity:0;transition:opacity .5s .35s;width:var(--cw,280px)}
.colh b{display:block;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--red)}
[dir="rtl"] .colh b{letter-spacing:0;font-size:15px}
.colh p{font-size:14px;color:var(--sub);line-height:1.4;margin-top:4px}
.board.sys .colh{opacity:1}
.bcap{text-align:center;margin-top:22px;font-size:20px;font-weight:600;letter-spacing:-.015em}
@media(max-width:820px){.board{height:980px}}

/* journey */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:56px;position:relative}
.step{padding:30px 24px;display:flex;flex-direction:column;gap:12px}
.step .n{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--red)}
[dir="rtl"] .step .n{letter-spacing:0;font-size:15px}
.step h3{font-size:22px}
.step p{font-size:16px;color:var(--sub)}
.step .obj{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-size:15px;font-weight:600;color:var(--ink)}
.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px}
.bar i{height:6px;border-radius:3px;background:var(--red)}
.bar i:nth-child(1){opacity:.25}.bar i:nth-child(2){opacity:.5}.bar i:nth-child(3){opacity:.75}
@media(max-width:900px){.steps,.bar{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.steps,.bar{grid-template-columns:1fr}.bar{display:none}}

/* work */
.work{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:56px}
.case{padding:32px 26px;display:flex;flex-direction:column;gap:16px}
.case .meta{font-size:14px;color:var(--sub)}
.case h3{font-size:34px;letter-spacing:-.03em}
.case .ind{font-size:15px;font-weight:600;color:var(--red);margin-top:-8px}
.case p{font-size:16px}
.case ul{margin:0;padding:0;list-style:none;display:grid;gap:7px;font-size:15px}
.case li{padding-inline-start:16px;position:relative}
.case li::before{content:"";position:absolute;inset-inline-start:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--red)}
.case .focus{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);font-size:15px}
.status{align-self:flex-start;font-size:12.5px;font-weight:600;background:var(--grey1);border-radius:999px;padding:5px 11px}
.note{font-size:15px;color:var(--sub);text-align:center;max-width:640px;margin:32px auto 0}
@media(max-width:900px){.work{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.work{grid-template-columns:1fr}}

/* services */
.svcs{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-top:56px;align-items:start}
.svc{padding:36px 32px;display:flex;flex-direction:column;gap:16px}
.svc.main{background:var(--dark);color:#F5F5F7}
.svc .tg{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
[dir="rtl"] .svc .tg{letter-spacing:0;font-size:14px}
.svc.main .tg{color:#FF6B62}
.svc h3{font-size:clamp(26px,3vw,34px);letter-spacing:-.03em}
.svc .d{font-size:16.5px;color:var(--sub)}
.svc.main .d{color:#A1A1A6}
.scope{display:grid;gap:14px;margin-top:6px}
.scope div{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.scope b{font-size:14px;color:#FF6B62;grid-row:span 2}
.scope strong{font-size:16.5px}
.scope span{font-size:14.5px;color:#A1A1A6}
.eng{font-size:14.5px;padding-top:14px;border-top:1px solid #3a3a3c;color:#D2D2D7}
.plist{margin:0;padding:0;list-style:none;display:grid;gap:10px;font-size:16px}
.plist li{padding:12px 16px;background:var(--grey1);border-radius:14px;font-weight:500}
.svc .btn{align-self:flex-start;margin-top:8px}
.svc.main .btn.ghost{color:#fff;box-shadow:inset 0 0 0 1.5px #fff}
@media(max-width:860px){.svcs{grid-template-columns:1fr}}

/* fit */
.fit{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:56px}
.fit>div{padding:32px 30px}
.fit h3{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:18px}
[dir="rtl"] .fit h3{letter-spacing:0;font-size:16px}
.fit .y h3{color:var(--red)}
.fit .n h3{color:var(--sub)}
.fit ul{margin:0;padding:0;list-style:none;display:grid;gap:13px;font-size:16.5px}
.fit li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.fit .y li::before{content:"✓";color:var(--red);font-weight:700}
.fit .n li{color:var(--sub)}
.fit .n li::before{content:"✕";font-weight:700}
@media(max-width:720px){.fit{grid-template-columns:1fr}}

/* call + form */
.call{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:56px}
.call>div{padding:32px 30px}
.call ul{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:10px;font-size:16.5px}
.call li{padding-inline-start:18px;position:relative}
.call li::before{content:"";position:absolute;inset-inline-start:0;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--red)}
.facts{display:grid;gap:0}
.facts div{display:flex;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);font-size:17px}
.facts div:last-child{border-bottom:0}
.facts span{color:var(--sub)}
.facts b{font-weight:600}
@media(max-width:760px){.call{grid-template-columns:1fr}}
.formcard{padding:40px 36px;margin-top:56px}
form{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
form .full{grid-column:1/-1}
.fld{display:grid;gap:8px;min-width:0}
.fld>label,.fld>legend{font-size:14.5px;font-weight:600}
.fld>label i,.fld>legend i{font-style:normal;color:var(--red);margin-inline-end:6px;font-size:13px}
input,select,textarea{font:16px inherit;font-family:inherit;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--grey1);color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);background:#fff}
fieldset{border:0;padding:0;margin:0}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills label{position:relative}
.pills input{position:absolute;opacity:0;width:1px;height:1px}
.pills span{display:inline-block;padding:9px 15px;border-radius:999px;background:var(--grey1);font-size:14.5px;cursor:pointer;border:1px solid transparent}
.pills input:checked+span{background:var(--ink);color:#fff}
.pills input:focus-visible+span{outline:2px solid var(--red);outline-offset:2px}
.priv{font-size:13.5px;color:var(--sub)}
.ok{grid-column:1/-1;background:var(--grey1);border-radius:18px;padding:28px;text-align:center}
.ok h3{font-size:26px}
.ok p{color:var(--sub);margin-top:8px}
@media(max-width:700px){form{grid-template-columns:1fr}.formcard{padding:28px 20px}}

footer{background:var(--dark);color:#A1A1A6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:56px 40px;font-size:14px}
footer .w{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:28px}
footer .w>*{min-width:0}
footer strong{display:block;color:#F5F5F7;font-size:17px}
footer .s{color:#F5F5F7;margin-top:14px;font-weight:600}
footer .sa{font-family:var(--ar);direction:rtl;text-align:start;margin-top:2px}
[dir="ltr"] footer .sa{text-align:left}
footer nav{all:unset;display:grid;gap:8px}
footer a{text-decoration:none}
footer a:hover{color:#fff}
footer .cp{grid-column:1/-1;border-top:1px solid #3a3a3c;padding-top:18px;font-size:13px}
@media(max-width:760px){footer .w{grid-template-columns:1fr}}
.draft{position:fixed;inset-inline-end:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;font:500 12px var(--sans);border-radius:999px;padding:6px 12px;z-index:9}
</style>

/* ---------- motion: 1 fade-up, 2 word reveal, 3 count-up, 5 breathing glow (CSS), 7 underline, 8 shine (CSS), 9 sticky (CSS) ---------- */
function initMotion(t){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  // 2 + 7: split headlines into words; underline the last word of the hero and method headlines
  document.querySelectorAll('h1,h2').forEach(h=>{
    const words=h.textContent.trim().split(/\s+/);
    const ul=!!h.closest('.method-h');
    h.innerHTML=words.map((w,i)=>`<span class="wd${ul&&i===words.length-1?' ul':''}" style="--d:${i*70}ms">${esc(w)}</span>`).join(' ');
    h.classList.add('split');
  });
  if(reduce||!('IntersectionObserver' in window))return;
  const vh=innerHeight;
  const targets=[...document.querySelectorAll('.split,.card,.close,.lead,.ctas,.board,.bar,.note,.stat')];
  targets.forEach(el=>{if(el.getBoundingClientRect().top>vh*0.92)el.classList.add('pre')});
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target;el.classList.remove('pre');el.classList.add('in');io.unobserve(el)}),{rootMargin:'0px 0px -8% 0px'});
  targets.forEach(el=>io.observe(el));
  // hero headline plays on load
  document.querySelectorAll('.hero2 .split').forEach(h=>{h.classList.add('pre');requestAnimationFrame(()=>requestAnimationFrame(()=>{h.classList.remove('pre');h.classList.add('in')}))});
  // hero: 3D tilt — portrait and THE MARKETER move in opposite directions with the pointer; gentle drift on touch
  const hero=document.querySelector('.hero2');
  if(hero){const por=hero.querySelector('.swp')||hero.querySelector('.por'),gw=hero.querySelector('.giant');let auto=!matchMedia('(hover:hover)').matches,t0=performance.now();
    const set=(x,y)=>{por.style.setProperty('--ry',(x*9)+'deg');por.style.setProperty('--rx',(-y*5)+'deg');por.style.setProperty('--tx',(x*12)+'px');gw.style.translate=`${-x*26}px ${-y*10}px`};
    hero.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const r=hero.getBoundingClientRect();set((e.clientX-r.left)/r.width-.5,(e.clientY-r.top)/r.height-.5)});
    hero.addEventListener('pointerleave',()=>set(0,0));
    if(auto)(function loop(t){if(!hero.isConnected)return;set(Math.sin((t-t0)/1500)*.3,Math.sin((t-t0)/2300)*.2);requestAnimationFrame(loop)})(t0);}
  // journey: a scroll-linked path walks the customer through the 4 stages
  const jour=document.getElementById('jour');
  if(jour){const steps=[...jour.querySelectorAll('.step')],nodes=[...jour.querySelectorAll('.node')];
    const upd=()=>{const r=jour.getBoundingClientRect();const p=Math.max(0,Math.min(1,(innerHeight*.78-r.top)/(r.height*.75)));jour.style.setProperty('--p',p);
      steps.forEach((s,i)=>{const on=p>=(i*.25+.06);s.classList.toggle('lit',on);nodes[i].classList.toggle('lit',on)})};
    jour.classList.add('live');addEventListener('scroll',upd,{passive:true});addEventListener('resize',upd);upd();}
  // 3: count-up on the proof numbers
  document.querySelectorAll('.stat b').forEach(b=>{
    const txt=b.textContent,m=txt.match(/\d+/);if(!m)return;const n=+m[0];
    const run=()=>{let t0;const go=ts=>{t0??=ts;const p=Math.min(1,(ts-t0)/1500);b.textContent=txt.replace(m[0],Math.round(n*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(go)};requestAnimationFrame(go)};
    const o=new IntersectionObserver(es=>{if(es[0].isIntersecting){run();o.disconnect()}},{threshold:.6});o.observe(b);
  });
}

function setupBoard(t){
const board=document.getElementById('board'),cap=document.getElementById('bcap'),tA=document.getElementById('tA'),tB=document.getElementById('tB');
const rtl=t.dir==='rtl';
const chips=[];t.method.cols.forEach(([,,items],c)=>items.forEach(x=>{const s=document.createElement('span');s.className='chip';s.textContent=x;s.style.setProperty('--dl',(chips.length*0.37%3)+'s');board.appendChild(s);chips.push({s,c})}));
const NOISE=rtl?["تخفيضات عشوائية","ترندات","شعار جديد","ترويج منشور","مسابقات","هاشتاغات","تقليد المنافسين","النشر يومياً","فلاتر وموسيقى","متابعون أكثر"]:["Random discounts","Trending audio","New logo","Boost post","Giveaways","#Hashtags","Copy competitors","Post daily","More followers","Viral hacks"];
const noise=NOISE.map((x,k)=>{const s=document.createElement('span');s.className='chip noise';s.textContent=x;s.style.setProperty('--dl',(k*0.53%3)+'s');board.appendChild(s);return s});
const heads=[...board.querySelectorAll('.colh')];
const order=[6,1,8,2,10,4,11,0,3,9,5,7];
const rnd=i=>{const x=Math.sin(i*99.13)*10000;return x-Math.floor(x)};
let sys=false;
function layout(){
  const W=board.clientWidth,H=board.clientHeight,nar=W<820,pad=24;
  const X=(x,w)=>rtl?W-x-w:x;
  const all=[...chips.map(o=>o.s),...noise];
  if(!sys){all.forEach((s,k)=>{const i=k<12?order[k]:k+5;const w=s.offsetWidth,h=s.offsetHeight;const x=pad+rnd(i+1)*(W-w-2*pad),y=pad+rnd(i+7)*(H-h-2*pad);s.style.transform=`translate(${x}px,${y}px) rotate(${(rnd(i+3)-.5)*18}deg)`;s.style.transitionDelay='0s'});return}
  noise.forEach((s,k)=>{const cur=s.style.transform.replace(/scale\([^)]*\)/,'');s.style.transform=cur+' scale(.6)';s.style.transitionDelay=(k*0.03)+'s'});
  chips.forEach((o,k)=>o.s.style.transitionDelay=(0.15+k*0.05)+'s');
  if(nar){const p2=10,cw=(W-2*p2)/3;[0,1,2].forEach(c=>{const hd=heads[c];hd.style.setProperty('--cw',(cw-6)+'px');const x=p2+c*cw;hd.style.transform=`translate(${X(x,cw-6)}px,14px)`;let y=58;chips.filter(o=>o.c===c).forEach(o=>{o.s.style.maxWidth=(cw-8)+'px';o.s.style.transform=`translate(${X(x,o.s.offsetWidth)}px,${y}px)`;y+=o.s.offsetHeight+8})});return}
  const cw=(W-2*pad)/3;[0,1,2].forEach(c=>{const hd=heads[c];hd.style.setProperty('--cw',(cw-28)+'px');const x=pad+c*cw;hd.style.transform=`translate(${X(x,cw-28)}px,30px)`;let y=150;chips.filter(o=>o.c===c).forEach(o=>{o.s.style.transform=`translate(${X(x,o.s.offsetWidth)}px,${y}px)`;y+=60})});
}
function set(v){sys=v;board.classList.toggle('sys',v);tA.setAttribute('aria-pressed',!v);tB.setAttribute('aria-pressed',v);cap.textContent=v?t.method.capOn:t.method.capOff;layout()}
tA.onclick=()=>set(false);tB.onclick=()=>set(true);
window.onresize=layout;document.fonts&&document.fonts.ready.then(layout);layout();
}

</script>
